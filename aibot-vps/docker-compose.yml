services:
  claude:
    build: .
    restart: unless-stopped
    init: true
    volumes:
      - ./data/claude:/home/claude/.claude
      - ./workspace:/workspace
      - ./ssh/config:/home/claude/.ssh/config:ro
      - ./ssh/known_hosts:/home/claude/.ssh/known_hosts
      - ../dotfiles-configs/.claude:/home/claude/.claude-dotfiles:ro
    secrets:
      - raspberry_key
      - worker_pc_key
      - raspberry_sudo_pass
      - github_token
      - openai_api_key
      - telegram_bot_token
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x claude >/dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

secrets:
  raspberry_key:
    file: ./secrets/raspberry_ed25519
  worker_pc_key:
    file: ./secrets/worker_pc_ed25519
  raspberry_sudo_pass:
    file: ./secrets/raspberry_sudo_pass
  github_token:
    file: ./secrets/github_token
  openai_api_key:
    file: ./secrets/openai_api_key
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
